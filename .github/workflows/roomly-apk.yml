
name: Generar APK Roomly

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Direccion HTTPS del backend con /api/auth'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Instalar dependencias
        working-directory: app
        run: flutter pub get

      - name: Generar APK Android
        working-directory: app
        env:
          ROOMLY_API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --debug --dart-define="ROOMLY_API_BASE_URL=${ROOMLY_API_BASE_URL}"

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Roomly-Android-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
